name: Publish Website to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🚀 Deploy to cPanel via FTP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. Deploy por FTP/FTPS
      - name: FTP Deploy Action
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}        # ftp.lacasonapolleria.com
          username: ${{ secrets.FTP_USERNAME }}    # tinyacode@playful-navy-hippopotamus.lacasonapolleria.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps                           # usa FTPS explícito
          port: 21
          local-dir: ./dist                        # carpeta generada por Astro
          server-dir: /home/lacaltnh/astro-travels  # ruta en tu hosting
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**

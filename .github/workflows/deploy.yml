```yaml
name: Build and Deploy Website

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@10 --activate

      - name: Verify environment
        run: |
          echo "Node:"
          node --version
          echo "pnpm:"
          pnpm --version
          echo "OpenSSL:"
          openssl version
          echo "curl:"
          curl --version | head -n 1

      - name: Diagnose DNS
        run: |
          echo "======================================"
          echo "DNS DIAGNOSTIC"
          echo "======================================"

          HOST="ftp.accessibletravelperu.com"

          echo "Host: $HOST"
          echo ""
          echo "DNS:"
          getent hosts "$HOST" || true

          echo ""
          echo "IPv4:"
          getent ahostsv4 "$HOST" || true

          echo ""
          echo "IPv6:"
          getent ahostsv6 "$HOST" || true

      - name: Test FTP port 21
        run: |
          echo "======================================"
          echo "PORT 21 TEST"
          echo "======================================"

          HOST="ftp.accessibletravelperu.com"

          if timeout 15 bash -c "</dev/tcp/$HOST/21"; then
            echo "SUCCESS: Port 21 is reachable"
          else
            echo "ERROR: Port 21 is NOT reachable"
            exit 1
          fi

      - name: Test FTP connection
        run: |
          echo "======================================"
          echo "PLAIN FTP TEST"
          echo "======================================"

          curl \
            --verbose \
            --connect-timeout 15 \
            --max-time 30 \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://ftp.accessibletravelperu.com/" \
            || true

      - name: Test Explicit FTPS
        run: |
          echo "======================================"
          echo "EXPLICIT FTPS TEST"
          echo "======================================"

          curl \
            --verbose \
            --ftp-ssl \
            --ftp-ssl-reqd \
            --connect-timeout 15 \
            --max-time 30 \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://ftp.accessibletravelperu.com/" \
            || true

      - name: Test FTPS TLS handshake
        run: |
          echo "======================================"
          echo "FTPS TLS HANDSHAKE"
          echo "======================================"

          timeout 20 openssl s_client \
            -connect ftp.accessibletravelperu.com:21 \
            -starttls ftp \
            -servername ftp.accessibletravelperu.com \
            </dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TinaCMS + Astro
        run: pnpm build
        env:
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          PUBLIC_TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_BRANCH: main

      - name: Verify static build
        run: |
          echo "======================================"
          echo "BUILD CHECK"
          echo "======================================"

          test -f dist/index.html

          echo "dist/index.html exists"
          echo ""
          echo "Number of files:"
          find dist -type f | wc -l

      - name: Deploy ONLY dist to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
```

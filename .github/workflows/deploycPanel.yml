name: Publish Website to cPanel

on:
  push:
    branches:
      - main   # Se ejecuta cuando haces push a la rama main

jobs:
  deploy:
    name: 🚀 Deploy to cPanel via FTP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # Trae todo el historial, útil para despliegues

      # 2. Deploy por FTP
      - name: FTP Deploy Action
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./   # Carpeta local que quieres subir
          server-dir: /astro-travels/   # Carpeta en tu hosting cPanel
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
